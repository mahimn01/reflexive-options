name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 + 3.14 are the active-bugfix lines as of 2026-04
        # (3.14 went stable 2025-10-07). 3.12 is our declared minimum.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0  # no major-version tag published — pin to specific release
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (QuantLib)
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev

      - name: Install package
        # --locked fails if pyproject.toml is out of sync with uv.lock — desired CI behaviour.
        # Falls back to `uv sync --no-lockfile` semantics when uv.lock isn't committed yet.
        run: |
          if [ -f uv.lock ]; then
            uv sync --locked --all-extras --group dev
          else
            uv sync --all-extras --group dev
          fi

      - name: Lint (ruff check)
        run: uv run ruff check src tests

      - name: Lint (ruff format --check)
        run: uv run ruff format --check src tests

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Test (pytest)
        run: |
          uv run pytest \
            --cov=reflexive_options \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Prune uv cache
        run: uv cache prune --ci

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
