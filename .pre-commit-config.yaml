# Pre-commit hooks. Pinned exactly to versions in docs/quality_research_brief.md §5.
# mypy intentionally NOT here — runs in CI only. Rationale:
#   1. The pre-commit-mypy hook runs in an isolated venv and would require
#      duplicating the dependency list in `additional_dependencies`, which
#      drifts from pyproject.toml.
#   2. Mypy on a partial file set is incoherent — types in code you didn't
#      touch can change because of code you did, giving false greens.
# Use `bash scripts/verify.sh` (or `uv run mypy src`) for local typecheck.
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: debug-statements
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
